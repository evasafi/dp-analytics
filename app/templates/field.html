{% extends "base.html" %}
{% block title %}Field entry{% endblock %}
{% block content %}
  <p>Signed in as <strong>{{ user.username }}</strong> (field agent).</p>
  {% if done %}<p><strong>Submitted.</strong></p>{% endif %}
  {% if error %}<p><strong>{{ error }}</strong></p>{% endif %}

  <h3>New beneficiary record</h3>
  <form method="post" action="/field/submit">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <p><label>Region <select name="region">{% for r in regions %}<option>{{ r }}</option>{% endfor %}</select></label></p>
    <p><label>Household size (1 to 12) <input name="household_size" type="number" min="1" max="12" required></label></p>
    <p><label>Monthly transfer (0 to 500) <input name="monthly_transfer" type="number" min="0" max="500" step="0.01" required></label></p>
    <p><button type="submit">Submit</button></p>
  </form>

  <hr>
  <form method="post" action="/logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit">Sign out</button>
  </form>
{% endblock %}
