{% extends "base.html" %}
{% block title %}Signed in{% endblock %}
{% block content %}
  <p>Signed in as <strong>{{ user.username }}</strong> (role: {{ user.role }}).</p>
  <form method="post" action="/logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit">Sign out</button>
  </form>
{% endblock %}
